[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-webhook-catalog"
version = "0.1.0"
description = "Extraction pipeline for the SaaS webhook event catalog dataset"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyarrow>=16",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
